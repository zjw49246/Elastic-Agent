[project]
name = "elastic-agent"
version = "0.1.0"
description = "Elastic computing framework for managing cloud-based agent workers"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "argon2-cffi>=23.1.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "websockets>=13.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "pyyaml>=6.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
aliyun = [
    "alibabacloud-ecs20140526>=4.1.0",
    "alibabacloud-tea-openapi>=0.3.14",
]
aws = [
    "boto3>=1.35.0",
]
worker = [
    "watchdog>=5.0.0",
    "oss2>=2.18.0",
]
# PTY-hosted execution (worker-side). Pinned via uv.lock — when the PTY
# framework updates, run: uv lock --upgrade-package claude-pty && uv sync
pty = [
    "claude-pty",
]
all = [
    "elastic-agent[aliyun,aws,worker,pty]",
]
dev = [
    "boto3>=1.35.0",
    "pytest>=8.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0",
    "ruff>=0.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/elastic_agent"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "level0: Pure unit tests, no external dependencies",
    "level1: Uses DryRunProvider, no cloud credentials needed",
    "level2: Uses MockWorker, no real Worker needed",
    "level3: Uses LocalWorkerProcess, needs local runtime",
    "level4: Uses real cloud provider, needs credentials",
    "level5: Multi-worker integration tests",
    "level6: Full end-to-end with real infrastructure",
]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.uv.sources]
claude-pty = { git = "https://github.com/zjw49246/Claude-Code-PTY" }
